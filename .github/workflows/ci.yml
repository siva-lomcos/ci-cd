name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display project information
        run: |
          echo "Starting the CI pipeline"
          echo "Checking project files..."
          pwd
          ls -la

      - name: Validate README
        run: |
          test -f README.md
          grep -q "CI/CD Pipeline" README.md
          echo "README validation passed"